<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>五子棋 Customizable</title>
	<link href="../app.css" rel="stylesheet">
</head>

<body>
	<h1>五子棋<wbr />（可自定义）</h1>
	<hr>
	<a href="../index.html"><b>返回</b></a>
	<blockquote>回到“其他”页面</blockquote>
	<a href="https://github.com/Letionc/Letionc.github.io/tree/main/chess/Chess.js"><b>github Chess.js</b></a>
	<blockquote>网页在github上包含的一个 js 文件</blockquote>
	<a href="javascript:/* empty for dom listener */;" id="btn-create-instance">创建一个棋实例</a>
	<blockquote>点击开始一盘棋，根据下方的输入值（左键下棋，右键悔棋。黑白交替下棋）</blockquote>
	<label>宽：<input id="inp-w" type="number" min="5" step="1" value="15" placeholder="棋盘宽度，例如 15" />
	</label>
	<label>高：<input id="inp-h" type="number" min="5" step="1" value="15" placeholder="棋盘高度，例如 15" />
	</label>
	<label>胜利需要几子棋：<input id="inp-wincnt" type="number" min="5" step="1" value="5" placeholder="填 4 就是 四子棋" />
	</label>
	<br />
	<label>胜利检查的方向：<input id="inp-checker" type="number" min="5" step="1" value="[[0,1],[1,1],[1,0],[1,-1]]" placeholder="以这个 [dx,dy] 列表检查" />
	</label>
	
	<script src="BLOCKED?file=./app.js"></script>
</body>

</html>
